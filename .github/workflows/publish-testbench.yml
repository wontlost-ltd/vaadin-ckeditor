name: Publish TestBench Module to Maven Central

# 独立发布可选的 ckeditor-vaadin-testbench 模块。
# 与主模块 publish.yml 解耦：用 testbench-v* tag 或手动 dispatch 触发，
# 不影响主模块的 v* 发布流程。复用同一套 Sonatype Central + GPG secrets。

on:
  push:
    tags:
      - "testbench-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 5.3.0) - must match ckeditor-vaadin-testbench/pom.xml"
        type: string
        required: true
      draft:
        description: "Create GitHub release as draft"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  # verify-ci 需要读取 Actions API 以确认本 commit 的 CI 结论
  actions: read

defaults:
  run:
    working-directory: ckeditor-vaadin-testbench

jobs:
  # 与主模块 publish.yml 相同的发布门禁：Central 不可撤回，
  # 发布前必须确认本 commit 在 main 上且 CI 已通过。
  verify-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Assert commit is on main
        run: |
          set -euo pipefail
          git fetch origin main --depth=0 2>/dev/null || git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Commit $GITHUB_SHA is not an ancestor of origin/main — refusing to publish."
            exit 1
          fi
          echo "Commit is on main."

      - name: Assert CI passed for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 轮询等待 CI 完成（tag push 与本工作流几乎同时触发，CI 可能仍在运行中）。
          #
          # 判定规则（review 反馈两轮）：
          #   取该 commit 上 ci.yml 的全部 run，按 run_number 排序后**只看最新一条已结束的**：
          #     - 最新已结束 = success            → 通过
          #     - 最新已结束 = 其它结论            → 失败
          #     - 尚无已结束的 run                 → 继续等待
          #
          # 为什么不是「任一失败即拒绝」：那样一次失败后即便修好重跑成功也永远发不出去。
          # 为什么不是「任一成功即通过」：那样旧的成功 run 会掩盖之后的失败。
          # 取「最新结论」两种误判都能避免——它就是该 commit 当前的真实 CI 状态。
          #
          # 按 head_sha 匹配是刻意为之：同一 commit 的 main run 与 tag run 跑的是完全
          # 相同的代码，任一为最新成功结论都构成有效证据。
          for i in $(seq 1 60); do
            RUNS=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&per_page=100" \
              --jq '[.workflow_runs[] | {status, conclusion, run_number}]')
            # 先看有没有尚未结束的 run：若有，必须等它出结论再判断。
            # 否则「旧 run 成功 + 更新的 run 仍在跑」会被旧结论抢先放行，
            # 而那个在途 run 可能最终失败（review 第四轮指出）。
            PENDING=$(echo "$RUNS" | jq '[.[] | select(.status != "completed")] | length')
            LATEST=$(echo "$RUNS" | jq -r '[.[] | select(.status == "completed")] | sort_by(.run_number) | last | .conclusion // "none"')
            echo "attempt $i: pending=$PENDING latest_completed=$LATEST"

            if [[ "$PENDING" -eq 0 ]]; then
              if [[ "$LATEST" == "success" ]]; then
                echo "CI passed for $GITHUB_SHA (no runs in flight)."
                exit 0
              fi
              if [[ "$LATEST" != "none" ]]; then
                echo "::error::Latest CI run for $GITHUB_SHA concluded '$LATEST' — refusing to publish."
                exit 1
              fi
            fi
            sleep 20
          done
          echo "::error::Timed out waiting for CI to complete on $GITHUB_SHA."
          exit 1

  publish:
    needs: verify-ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ -z "${INPUT_VERSION:-}" ]]; then
              echo "::error::Version input is required for manual trigger."
              exit 1
            fi
            VERSION="${INPUT_VERSION}"
            TAG_NAME="testbench-v${VERSION}"
          else
            TAG_NAME="${GITHUB_REF_NAME}"
            if [[ ! "$TAG_NAME" =~ ^testbench-v ]]; then
              echo "::error::Tag must start with testbench-v followed by version (e.g. testbench-v5.3.0)."
              exit 1
            fi
            VERSION="${TAG_NAME#testbench-v}"
          fi

          # Strict SemVer validation of the resolved version (applies to both trigger paths).
          # Full-string match avoids accepting partial/garbage versions like "5.3.0-typo".
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version format: '$VERSION'. Expected X.Y.Z or X.Y.Z-suffix (e.g. 5.3.0, 5.3.0-rc1)."
            exit 1
          fi

          # Verify the testbench module pom.xml version matches
          POM_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          if [[ "$POM_VERSION" != "$VERSION" ]]; then
            echo "::error::ckeditor-vaadin-testbench/pom.xml version ($POM_VERSION) does not match release version ($VERSION)"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"
          echo "Resolved version: $VERSION (matches ckeditor-vaadin-testbench/pom.xml)"

      - name: Publish to Maven Central
        run: mvn -B -ntp clean deploy -Prelease
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: testbench-v${{ steps.version.outputs.version }}
          draft: ${{ inputs.draft || false }}
          generate_release_notes: true
          files: |
            ckeditor-vaadin-testbench/target/ckeditor-vaadin-testbench-${{ steps.version.outputs.version }}.jar
            ckeditor-vaadin-testbench/target/ckeditor-vaadin-testbench-${{ steps.version.outputs.version }}-sources.jar
            ckeditor-vaadin-testbench/target/ckeditor-vaadin-testbench-${{ steps.version.outputs.version }}-javadoc.jar
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Job Summary
        if: always()
        run: |
          {
            echo "## TestBench Module Release Summary"
            echo ""
            echo "| Parameter | Value |"
            echo "|-----------|-------|"
            echo "| Version | \`${VERSION:-n/a}\` |"
            echo "| Tag | \`${TAG_NAME:-n/a}\` |"
            echo "| Maven Central | \`com.wontlost:ckeditor-vaadin-testbench:${VERSION:-n/a}\` |"
            echo "| Status | \`${{ job.status }}\` |"
            echo ""
            if [[ "${{ job.status }}" == "success" ]]; then
              echo "Published to [Maven Central](https://central.sonatype.com/artifact/com.wontlost/ckeditor-vaadin-testbench/${VERSION})"
              echo ""
              echo "Released to [GitHub Releases](https://github.com/${{ github.repository }}/releases/tag/${TAG_NAME})"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
