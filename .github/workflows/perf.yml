name: Performance

# 性能套件（issue #137）：与功能 e2e 隔离，避免拖慢每个 PR。
# 在改动连接器 / Java 组件 / 性能套件本身的 PR、每周定时与手动触发时运行。
on:
  pull_request:
    branches: [main]
    paths:
      - "src/main/**"
      - "examples/spring-boot-sample/**"
      - "e2e/perf/**"
      - "e2e/playwright.perf.config.ts"
      - ".github/workflows/perf.yml"
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perf-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install addon to local Maven repo
        run: mvn -B -ntp install -DskipTests

      - name: Build sample app (production)
        working-directory: examples/spring-boot-sample
        run: mvn -B -ntp -DskipTests package -Pproduction

      - name: Install Playwright dependencies
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run performance suite
        working-directory: e2e
        env:
          CI: "true"
        run: npm run test:perf

      # 无论成败都上传实测结果，便于观察趋势与调整 budgets.json
      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-results
          path: |
            e2e/perf-results/
            e2e/perf-report/
          retention-days: 30
