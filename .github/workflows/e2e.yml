name: E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # 手动触发：update_snapshots=true 时只跑视觉回归并重新生成 Linux 基线，
  # 以 artifact 形式上传，由维护者下载后提交（基线只能在 ubuntu-latest 上生成，本机无法）。
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: "Regenerate Linux visual-regression baselines and upload them as an artifact"
        type: boolean
        default: false

permissions:
  contents: read

# Cancel stale runs when a new commit is pushed to the same ref so PRs don't pile up CI minutes.
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install addon to local Maven repo
        run: mvn -B -ntp install -DskipTests

      - name: Build sample app (production)
        working-directory: examples/spring-boot-sample
        run: mvn -B -ntp -DskipTests package -Pproduction

      - name: Install Playwright dependencies
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox

      - name: Run Playwright tests
        if: ${{ !inputs.update_snapshots }}
        working-directory: e2e
        env:
          CI: "true"
        run: npx playwright test

      - name: Regenerate visual baselines
        if: ${{ inputs.update_snapshots }}
        working-directory: e2e
        env:
          CI: "true"
        run: npx playwright test tests/visual-regression.spec.ts --update-snapshots

      - name: Upload regenerated baselines
        if: ${{ inputs.update_snapshots }}
        uses: actions/upload-artifact@v7
        with:
          name: visual-baselines
          path: e2e/tests/__screenshots__/
          retention-days: 7

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Upload test traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: e2e/test-results/
          retention-days: 7
